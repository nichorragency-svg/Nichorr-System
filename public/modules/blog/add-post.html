<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nichorr AI | Professional Publisher</title>
    <link rel="stylesheet" href="/NichorrTheme.css">
    <style>
        body { background-color: #020617; color: white; font-family: 'Inter', sans-serif; margin: 0; }
        
        /* Main Container */
        .page-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Back Button */
        .nav-header {
            width: 100%;
            max-width: 650px;
            margin-bottom: 15px;
        }
        .btn-back {
            color: #64748b;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-back:hover { color: #ef4444; }

        .editor-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 32px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        .header-title {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 800;
        }
        .header-title span { color: #ef4444; }

        .input-row { margin-bottom: 20px; }

        label {
            display: block;
            color: #94a3b8;
            margin-bottom: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        .media-section {
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 16px;
            border: 1px dashed #475569;
            margin: 25px 0;
        }

        .btn-nichorr {
            background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        .btn-nichorr:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.5);
        }

        textarea { height: 250px; line-height: 1.6; resize: vertical; }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .editor-card { padding: 25px; border-radius: 20px; }
            .header-title { font-size: 1.4rem; }
            .btn-nichorr { padding: 15px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="nav-header">
            <a href="blog.html" class="btn-back">← BACK TO BLOGS</a>
        </div>

        <div class="editor-card">
            <h2 class="header-title">Nichorr <span>Publisher</span> Pro</h2>
            
            <form id="manualPostForm" enctype="multipart/form-data">
                
                <div class="input-row">
                    <label>Article Title</label>
                    <input type="text" name="title" placeholder="Enter a catchy title..." required>
                </div>

                <div class="input-row">
                    <label>Category / Niche</label>
                    <select name="category">
                        <option value="SEO Strategy">SEO Strategy</option>
                        <option value="Technology">Technology</option>
                        <option value="Marketing">Marketing Insights</option>
                        <option value="Case Study">Case Study</option>
                        <option value="AI Tools">AI Tools & Innovation</option>
                    </select>
                </div>

                <div class="media-section">
                    <label>Featured Thumbnail</label>
                    <input type="file" name="blogImage" id="fileInput" style="margin-bottom: 15px; color: #94a3b8; font-size: 0.8rem;">
                    <input type="text" name="imageurl" placeholder="Paste Image URL here (Alternative)">
                </div>

                <div class="input-row">
    <label>Smart Hashtag Library (Click to Add)</label>
    <div id="hashtagLibrary" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; background: rgba(15, 23, 42, 0.4); padding: 15px; border-radius: 12px; border: 1px solid #334155;">
        </div>
    <input type="text" id="selectedTags" name="tags" placeholder="Hashtags will appear here..." style="font-size: 0.8rem; color: #38bdf8; border-color: rgba(56, 189, 248, 0.3);">
</div>

                <div class="input-row">
                    <label>Article Body (HTML Supported)</label>
                    <textarea name="content" placeholder="Paste your HTML content here..." required></textarea>
                </div>

                <button type="submit" class="btn-nichorr">Publish Insight</button>
            </form>
        </div>
    </div>

    
<script>
    // 1. Hashtag Data Bank
const nichorrHashtags = {
    "SEO Strategy": "#SEO #Backlinks #OrganicGrowth #NichorrAI #SearchRanking",
    "Technology": "#TechTrends #Innovation #Software #FutureTech #TechUpdate",
    "Marketing": "#DigitalMarketing #MarketingTips #Branding #GrowthHacking",
    "Case Study": "#CaseStudy #BusinessAnalysis #DataDriven #SuccessStory",
    "AI Tools": "#ArtificialIntelligence #AITools #Automation #MachineLearning #SmartTech"
};

const hashtagLibrary = document.getElementById('hashtagLibrary');
const tagInput = document.getElementById('selectedTags');
const contentArea = document.querySelector('textarea[name="content"]');

// 2. Buttons banane ka function
// 2. Buttons banane ka function (FIXED)
function loadTags(category) {
    hashtagLibrary.innerHTML = ""; // Purane tags saaf karein
    tagInput.value = ""; // Input box bhi clear karein
    
    const tags = nichorrHashtags[category] || "#Nichorr #AI #Automation";
    const tagArray = tags.split(' ');

    tagArray.forEach(tag => {
        const span = document.createElement('span');
        span.innerText = tag;
        span.style = "background: #1e293b; color: #38bdf8; padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; border: 1px solid #334155; transition: 0.3s; user-select: none;";
        
        // Click karne par Textarea AUR Input dono update honge
        span.onclick = () => {
            // Check karein agar tag pehle se add toh nahi
            if(!tagInput.value.includes(tag)) {
                // 1. Content Area (Article Body) mein add karein
                contentArea.value += "\n" + tag; 
                
                // 2. Selected Tags wale input box mein bhi add karein
                tagInput.value += (tagInput.value ? " " : "") + tag;

                // Visual Feedback
                span.style.background = "#38bdf8";
                span.style.color = "#0f172a";
                span.style.borderColor = "white";
            }
        };

        hashtagLibrary.appendChild(span);
    });
}

// 3. Category change hone par tags badalna
document.querySelector('select[name="category"]').onchange = (e) => {
    loadTags(e.target.value);
};

// Pehli dafa load hone par
loadTags("SEO Strategy");

document.getElementById('manualPostForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const originalText = btn.innerText;
    
    btn.innerText = "System: Publishing...";
    btn.style.opacity = "0.7";
    btn.disabled = true;

    const formData = new FormData(e.target);

    try {
        const response = await fetch('/api/blogs/manual', {
            method: 'POST',
            body: formData
        });

        const result = await response.json();
        if(result.success) {
            alert("Success: Your content is now live on Nichorr!");
            window.location.href = 'blog.html';
        } else {
            alert("Error: Failed to publish content. Please check details.");
        }
    } catch (error) {
        console.error("Server Error:", error);
        alert("Critical Error: Connection to server failed.");
    } finally {
        btn.innerText = originalText;
        btn.style.opacity = "1";
        btn.disabled = false;
    }
};
</script>
</body>
</html>
