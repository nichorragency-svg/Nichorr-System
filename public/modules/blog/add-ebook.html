<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New E-Book | Nichorr Publisher</title>
    <link rel="stylesheet" href="/NichorrTheme.css">
    <style>
        body { 
            background-color: #020617; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 20px 0; 
        }

        .glass-form-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header-section { text-align: center; margin-bottom: 30px; }
        .header-section h2 { font-size: 2rem; margin: 0; }
        .header-section h2 span { color: #3b82f6; text-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-group { margin-bottom: 15px; }
        .full-width { grid-column: span 2; }

        label { display: block; color: #94a3b8; margin-bottom: 8px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.7);
            color: white;
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus { border-color: #3b82f6; background: rgba(30, 41, 59, 0.6); }

        /* Media Handling */
        .media-box {
            background: rgba(0,0,0,0.2);
            border: 2px dashed #334155;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .preview-box {
            width: 100%;
            height: 120px;
            margin-top: 10px;
            border-radius: 8px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .preview-box img { max-width: 100%; max-height: 100%; display: none; }

        .btn-row { display: flex; gap: 10px; margin-top: 20px; }

        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            border: none;
        }

        .btn-publish { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; }
        .btn-view { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid #3b82f6; }
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }

        .remove-btn { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.6rem; cursor: pointer; display: none; margin: 5px auto; }

        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } .btn-row { flex-direction: column; } }
    </style>
</head>
<body>

    <div class="glass-form-card">
        <div class="header-section">
            <h2>Create <span>E-Book</span></h2>
            <p style="color: #64748b; font-size: 0.8rem;">Manage your premium digital assets</p>
        </div>

        <form id="addEbookForm">
            <div class="form-grid">
                <div class="input-group full-width">
                    <label>Book Title</label>
                    <input type="text" id="title" placeholder="e.g. SEO Master" required>
                </div>
                <div class="input-group">
                    <label>Writer Name</label>
                    <input type="text" id="writer" placeholder="Author Name" required>
                </div>

                <div class="input-group">
                    <label>Price ($)</label>
                    <input type="number" id="price" placeholder="0.00" step="0.01" required>
                </div>

                <div class="input-group">
                    <label>Niche / Category</label>
                    <select id="niche">
                        </select>
                </div>

                <div class="input-group">
                    <label>Initial Rating</label>
                    <select id="rating">
                        <option value="5">⭐⭐⭐⭐⭐ (5.0)</option>
                        <option value="4">⭐⭐⭐⭐☆ (4.0)</option>
                    </select>
                </div>

                <div class="input-group full-width">
                    <label>Book PDF (Upload or Cloud Link)</label>
                    <div class="media-box">
                        <input type="file" id="pdfFile" accept=".pdf" style="font-size: 0.7rem;">
                        <p style="font-size: 0.7rem; margin: 5px 0; color: #475569;">— OR —</p>
                        <input type="url" id="pdfLink" placeholder="Paste Drive/Dropbox Link">
                    </div>
                </div>

                <div class="input-group full-width">
                    <label>Cover Image (Upload or Paste URL)</label>
                    <div class="media-box">
                        <input type="file" id="fileInput" accept="image/*" onchange="previewMedia(this, 'file')" style="font-size: 0.7rem;">
                        <p style="font-size: 0.7rem; margin: 5px 0; color: #475569;">— OR —</p>
                        <input type="text" id="imageurl" placeholder="Paste Image URL" oninput="previewMedia(this, 'url')">
                        <div class="preview-box">
                            <span id="previewText" style="color:#475569; font-size: 0.7rem;">Cover Preview</span>
                            <img id="previewImg" src="">
                        </div>
                        <button type="button" id="removeBtn" class="remove-btn" onclick="clearPreview()">Remove Image ✖</button>
                    </div>
                </div>

                <div class="input-group full-width">
                    <label>Short Description</label>
                    <textarea id="description" rows="2" placeholder="Brief info..."></textarea>
                </div>
            </div>

            <div class="btn-row">
                <button type="submit" class="btn btn-publish">🚀 Publish</button>
                <button type="button" class="btn btn-view" onclick="viewBook()">👁️ View</button>
                <button type="button" class="btn btn-delete" onclick="deleteForm()">🗑️ Delete</button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="ebooks.html" style="color: #94a3b8; text-decoration: none; font-size: 0.8rem;">← Back to Store</a>
        </div>
    </div>

    <script>
    // 1. Categories load karna (As it is)
    const niches = ["Agriculture", "Marketing", "Real Estate", "E-commerce", "Technology", "Health", "Fashion", "Education", "Travel", "Crypto"];
    const nicheSelect = document.getElementById('niche');
    niches.forEach(n => {
        let opt = document.createElement('option');
        opt.value = n;
        opt.innerText = n;
        nicheSelect.appendChild(opt);
    });

    // 2. Media Preview Logic
    function previewMedia(input, type) {
        const img = document.getElementById('previewImg');
        const txt = document.getElementById('previewText');
        const btn = document.getElementById('removeBtn');

        if (type === 'file' && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { img.src = e.target.result; show(); }
            reader.readAsDataURL(input.files[0]);
        } else if (type === 'url' && input.value) {
            img.src = input.value; show();
        }

        function show() { img.style.display = "block"; txt.style.display = "none"; btn.style.display = "block"; }
    }

    function clearPreview() {
        document.getElementById('previewImg').style.display = "none";
        document.getElementById('previewText').style.display = "block";
        document.getElementById('removeBtn').style.display = "none";
        document.getElementById('fileInput').value = "";
        document.getElementById('imageurl').value = "";
    }

    // 3. BACKEND SUBMISSION (Updated for MongoDB)
    document.getElementById('addEbookForm').onsubmit = async (e) => {
    e.preventDefault();
    
    // 💡 FormData use karein taake files sahi se jayen
    const formData = new FormData();
    formData.append('title', document.getElementById('title').value);
    formData.append('writer', document.getElementById('writer').value);
    formData.append('price', document.getElementById('price').value);
    formData.append('niche', document.getElementById('niche').value);
    formData.append('rating', document.getElementById('rating').value);
    formData.append('desc', document.getElementById('description').value);
    formData.append('pdfLink', document.getElementById('pdfLink').value);
    formData.append('imageurl', document.getElementById('imageurl').value);

    // 💡 File upload handle karein
    const fileInput = document.getElementById('fileInput');
    if(fileInput.files[0]) {
        formData.append('ebookFile', fileInput.files[0]); // Multer isi naam se uthayega
    }

    try {
        const response = await fetch('/api/blogs/add-ebook', {
            method: 'POST',
            body: formData // ❌ Headers mein Content-Type mat likhna, browser khud set karega
        });

        const result = await response.json();
        if (result.success) {
            alert("✅ E-Book Saved!");
            window.location.href = 'ebooks.html';
        }
    } catch (err) {
        alert("❌ Error: " + err.message);
    }
};

    function deleteForm() { 
        if(confirm("Clear all fields?")) {
            document.getElementById('addEbookForm').reset(); 
            clearPreview(); 
        }
    }
    
    function viewBook() { alert("Preview feature is coming soon!"); }
</script>
</body>
</html>
