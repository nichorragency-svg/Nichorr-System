<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | Nichorr Insights</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- PURANI STYLING WAHI HAI --- */
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; line-height: 1.6; }

        /* Reading Progress Bar */
        #progress-bar {
            position: fixed; top: 0; left: 0; height: 4px; background: #3b82f6;
            width: 0%; z-index: 2000; transition: width 0.1s;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .ad-slot {
            background: rgba(255, 255, 255, 0.03); border: 1px dashed rgba(255, 255, 255, 0.1);
            color: #475569; display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
            margin: 30px auto; border-radius: 16px; width: 100%; max-width: 728px; min-height: 90px;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; }

        .header-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; margin-bottom: 30px; }
        .back-link { color: #94a3b8; text-decoration: none; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .back-link:hover { color: #3b82f6; }

        /* Article Glass Card */
        .article-card {
            background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 32px;
            padding: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); position: relative;
        }

        /* SOCIAL SHARE SIDEBAR */
        .share-sidebar {
            position: absolute; left: -70px; top: 100px; display: flex; flex-direction: column; gap: 15px;
        }
        .share-btn {
            width: 45px; height: 45px; border-radius: 50%; background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; transition: 0.3s; cursor: pointer;
        }
        .share-btn:hover { color: white; border-color: #3b82f6; transform: scale(1.1); }
        .share-btn.fb:hover { background: #1877f2; }
        .share-btn.ln:hover { background: #0077b5; }
        .share-btn.wa:hover { background: #25d366; }

        .post-category { background: rgba(59, 130, 246, 0.1); color: #3b82f6; padding: 6px 16px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; display: inline-block; margin-bottom: 20px; }
        .post-title { font-size: clamp(1.8rem, 5vw, 3.2rem); font-weight: 900; margin: 0 0 20px 0; line-height: 1.1; letter-spacing: -1px; color: #ffffff; }
        .post-meta { display: flex; gap: 20px; color: #64748b; font-size: 0.9rem; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .featured-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 24px; margin-bottom: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .post-content { line-height: 1.9; color: #cbd5e1; font-size: 1.15rem; }
        .post-content h2 { color: #3b82f6; margin-top: 40px; }

        /* Mobile Adjustments */
        @media (max-width: 1100px) {
            .share-sidebar { 
                position: relative; left: 0; top: 0; flex-direction: row; 
                justify-content: center; margin-bottom: 30px; 
            }
        }
        @media (max-width: 600px) {
            .article-card { padding: 25px 20px; border-radius: 20px; }
            .post-title { font-size: 1.7rem; }
        }
    </style>
</head>
<body>

    <div id="progress-bar"></div>

    <div class="container">
        <div class="ad-slot">Advertisement - Header 728x90</div>

        <div class="header-nav">
            <a href="blog.html" class="back-link">← BACK TO FEED</a>
            <div style="font-size: 0.7rem; color: #475569; font-weight: 800; letter-spacing: 2px;">NICHORR ENGINE v3.0</div>
        </div>

        <main id="articleArea">
            <div style="text-align: center; padding: 100px 0;">
                <p style="color: #64748b; font-size: 1.2rem;">Decrypting Insight Data...</p>
            </div>
        </main>

        <div style="background: rgba(59, 130, 246, 0.05); border: 1px solid rgba(59, 130, 246, 0.1); border-radius: 24px; padding: 30px; margin-top: 40px; text-align: center;">
            <h3 style="margin: 0; color: #fff;">Enjoyed this Insight?</h3>
            <p style="color: #94a3b8; font-size: 0.9rem;">Join 5,000+ publishers getting weekly SEO intelligence.</p>
            <a href="blog.html" style="color: #3b82f6; font-weight: bold; text-decoration: none;">SUBSCRIBE TO NICHORR →</a>
        </div>

        <div class="ad-slot">Advertisement - Footer 300x250</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        // Reading Progress Logic
        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById("progress-bar").style.width = scrolled + "%";
        };

        async function loadFullPost() {
            try {
                if(!postId) {
                    document.getElementById('articleArea').innerHTML = "<p style='text-align:center;'>Invalid Access: No ID provided.</p>";
                    return;
                }

                const response = await fetch(`/api/blogs/${postId}`);
                const data = await response.json();
                
                if(data.success && data.blog) {
                    const blog = data.blog;
                    const postUrl = encodeURIComponent(window.location.href);
                    const postTitle = encodeURIComponent(blog.title);
                    
                    document.title = blog.title + " | Nichorr Insights";
                    
                    document.getElementById('articleArea').innerHTML = `
                        <article class="article-card">
                            <div class="share-sidebar">
                                <a href="https://www.facebook.com/sharer/sharer.php?u=${postUrl}" target="_blank" class="share-btn fb" title="Share on Facebook"><i class="fab fa-facebook-f"></i></a>
                                <a href="https://www.linkedin.com/sharing/share-offsite/?url=${postUrl}" target="_blank" class="share-btn ln" title="Share on LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                                <a href="https://api.whatsapp.com/send?text=${postTitle}%20${postUrl}" target="_blank" class="share-btn wa" title="Share on WhatsApp"><i class="fab fa-whatsapp"></i></a>
                                <div onclick="navigator.clipboard.writeText(window.location.href); alert('Link Copied!');" class="share-btn" title="Copy Link"><i class="fas fa-link"></i></div>
                            </div>

                            <span class="post-category">${blog.category || 'SEO Strategy'}</span>
                            <h1 class="post-title">${blog.title}</h1>
                            
                            <div class="post-meta">
                                <span>📅 ${new Date(blog.createdAt || blog.date).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'})}</span>
                                <span>✍️ By Admin</span>
                            </div>

                            ${blog.imageurl ? `<img src="${blog.imageurl}" class="featured-img" alt="${blog.title}">` : ''}
                            
                            <div class="post-content">
                                ${blog.content}
                            </div>
                        </article>
                    `;
                } else {
                    document.getElementById('articleArea').innerHTML = `<div style="text-align:center; padding:50px;"><h2>Insight Missing</h2><a href="blog.html">Return to Feed</a></div>`;
                }
            } catch (e) { 
                document.getElementById('articleArea').innerHTML = "<p style='text-align:center; color:#ef4444;'>Connection Lost.</p>"; 
            }
        }
        
        loadFullPost();
    </script>
</body>
</html>
