<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nichorr AI</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 350px; border: 1px solid #e2e8f0; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 14px; background: #0f172a; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #1e293b; }
        .links { text-align: center; margin-top: 20px; font-size: 13px; color: #64748b; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 style="margin-top:0">Welcome Back 🍋</h2>
        <p style="font-size: 14px; color: #64748b; margin-bottom: 20px;">Please login to your account</p>
        
        <input type="email" id="emailInput" placeholder="Email Address">
        <input type="password" id="passInput" placeholder="Password">
        
        <button onclick="handleLogin()" id="loginBtn">Login to Dashboard</button>
        
        <div class="links">Don't have an account? <a href="/signup.html" style="color: #38bdf8; text-decoration: none; font-weight: bold;">Sign Up</a></div>
    </div>

    <script>
    async function handleLogin() {
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passInput').value;
        const btn = document.getElementById('loginBtn');

        if(!email || !password) return alert("Please fill all fields!");

        btn.innerText = "Checking...";
        btn.disabled = true;

        try {
            const res = await fetch('/api/nichorr/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await res.json();

            if(data.success) {
                // 🍋 LocalStorage mein data save karna (Boht zaroori hai)
                localStorage.setItem('nichorrToken', data.token);
                localStorage.setItem('userEmail', data.user.email);
                localStorage.setItem('userName', data.user.fullName);
                localStorage.setItem('userCredits', data.user.credits);
                localStorage.setItem('userPlan', data.user.plan);
                
                // Ab login success hone par hi dashboard khulay ga
                window.location.href = '/index.html'; 
            } else {
                alert("Error: " + data.message);
                btn.innerText = "Login to Dashboard";
                btn.disabled = false;
            }
        } catch (err) {
            alert("Server Error! Check if your node server is running.");
            btn.innerText = "Login to Dashboard";
            btn.disabled = false;
        }
    }
    </script>
</body>
</html>
